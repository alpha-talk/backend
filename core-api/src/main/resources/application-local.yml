spring:
  config:
    import:                                     # 저장소 루트 secrets.yml — 로컬 시크릿(.gitignore 대상). 없으면 무시되고 환경변수 경로로 동작
      - optional:file:./secrets.yml             # 저장소 루트에서 실행할 때
      - optional:file:../secrets.yml            # bootRun(작업 디렉터리=모듈 디렉터리)으로 실행할 때

alphatalk:
  auth:
    jwt:
      secret: insecure-local-dev-only-secret-0123456789abcdef
  stockinfo:
    minute-refresh-url: http://localhost:8082   # worker-price 분봉 신선화 내부 API — 미설정이면 저장분만 반환 (워커 명세 §2.6)
