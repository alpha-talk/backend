spring:
  config:
    import:                                     # 저장소 루트 secrets.yml — 로컬 시크릿(.gitignore 대상). 없으면 무시되고 환경변수 경로로 동작
      - optional:file:./secrets.yml             # 저장소 루트에서 실행할 때
      - optional:file:../secrets.yml            # bootRun(작업 디렉터리=모듈 디렉터리)으로 실행할 때

alphatalk:
  llm:
    provider: ${LLM_PROVIDER:claude-cli}
    consumer-batch: 1
    embedding:
      provider: ${EMBEDDING_PROVIDER:rest}
      base-url: ${EMBEDDING_BASE_URL:http://localhost:11434}
      api-key: ${EMBEDDING_API_KEY:ollama}
      model: ${EMBEDDING_MODEL:bge-m3}
      dimension: ${EMBEDDING_DIMENSION:1024}
