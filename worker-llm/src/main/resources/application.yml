spring:
  application:
    name: worker-llm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphatalk}
    username: ${DB_USER:alphatalk}
    password: ${DB_PASSWORD:alphatalk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8085          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  llm:
    provider: ${LLM_PROVIDER:anthropic} # anthropic | claude-cli | codex-cli | fake
    consume-enabled: true
    allow-fake: false
    consumer-block: 5s
    consumer-batch: 8
    poison-max-deliveries: 5      # 초과 시 queue:ingest:dlq 격리 (Redis 계약 v0.3 §2)
    claim-idle: 5m                # PEL 유휴 회수 임계 (죽은 워커 인계)
    claim-interval: 1m
    cluster:
      window-hours: 72            # 유사 기사 비교 창 (명세 §3.3)
      similarity-threshold: 0.85
      lock-ttl: 3s
    sector:
      fanout-cap: 100             # 초과 시 실시간 fan-out 억제 — 다이제스트로만 반영 (명세 §3.6)
    article:
      allowed-host-suffixes:     # 비우면 본문 fetch 전면 차단 — worker-ingest 피드 언론사와 짝을 맞춘다
        - yna.co.kr
        - hankyung.com
        - mk.co.kr
        - donga.com
        - khan.co.kr
        - hani.co.kr
        - chosun.com
        - newsis.com
        - sedaily.com
      min-host-interval: 1s
    models:
      summary: claude-haiku-4-5
      digest: claude-sonnet-5
    anthropic:
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      version: "2023-06-01"
      max-tokens: 1024
    claude-cli:
      executable: ${CLAUDE_CLI_EXECUTABLE:claude}
      model: ${CLAUDE_CLI_MODEL:}
      timeout: ${LLM_CLI_TIMEOUT:2m}
    codex-cli:
      executable: ${CODEX_CLI_EXECUTABLE:codex}
      model: ${CODEX_CLI_MODEL:}
      timeout: ${LLM_CLI_TIMEOUT:2m}
    embedding:
      provider: fake              # fake | rest(OpenAI 호환 /v1/embeddings)
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:}
      dimension: 1024

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
