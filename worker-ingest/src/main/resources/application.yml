spring:
  application:
    name: worker-ingest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8084          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  ingest:
    poll-enabled: true
    poll-delay: 5m
    poll-initial-delay: 10s
    seen-ttl: 7d      # Redis 계약 v0.5 §3 seen:ingest TTL
    queue-max-len: 10000
    excerpt-max-length: 200
    fetch-concurrency: 4
    feeds:
      - id: yna-economy
        source: yna
        url: https://www.yna.co.kr/rss/economy.xml
      - id: yna-industry
        source: yna
        url: https://www.yna.co.kr/rss/industry.xml
      - id: yna-society
        source: yna
        url: https://www.yna.co.kr/rss/society.xml
      - id: hankyung-economy
        source: hankyung
        url: https://www.hankyung.com/feed/economy
      - id: hankyung-finance
        source: hankyung
        url: https://www.hankyung.com/feed/finance
      - id: hankyung-society
        source: hankyung
        url: https://www.hankyung.com/feed/society
      - id: mk-economy
        source: mk
        url: https://www.mk.co.kr/rss/30100041/
      - id: mk-stock
        source: mk
        url: https://www.mk.co.kr/rss/50200011/
      - id: mk-society
        source: mk
        url: https://www.mk.co.kr/rss/50400012/
      - id: donga-economy
        source: donga
        url: https://rss.donga.com/economy.xml
      - id: donga-society
        source: donga
        url: https://rss.donga.com/national.xml
      - id: khan-economy
        source: khan
        url: https://www.khan.co.kr/rss/rssdata/economy_news.xml
      - id: khan-society
        source: khan
        url: https://www.khan.co.kr/rss/rssdata/society_news.xml
      - id: hani-economy
        source: hani
        url: https://www.hani.co.kr/rss/economy/
      - id: hani-society
        source: hani
        url: https://www.hani.co.kr/rss/society/
      - id: chosun-economy
        source: chosun
        url: https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml
      - id: chosun-society
        source: chosun
        url: https://www.chosun.com/arc/outboundfeeds/rss/category/national/?outputType=xml
      - id: newsis-economy
        source: newsis
        url: https://www.newsis.com/RSS/economy.xml
      - id: newsis-finance
        source: newsis
        url: https://www.newsis.com/RSS/bank.xml
      - id: newsis-industry
        source: newsis
        url: https://www.newsis.com/RSS/industry.xml
      - id: newsis-society
        source: newsis
        url: https://www.newsis.com/RSS/society.xml
      - id: sedaily-finance
        source: sedaily
        url: https://www.sedaily.com/rss/finance
      - id: sedaily-economy
        source: sedaily
        url: https://www.sedaily.com/rss/economy
      - id: sedaily-society
        source: sedaily
        url: https://www.sedaily.com/rss/society
    stocks: []        # 시드 종목 — 네이버 검색 쿼리·일일 다이제스트 대상 (사전 매핑 아님)
                      # - code: "005930"
                      #   name: 삼성전자
    naver:
      client-id: ${NAVER_CLIENT_ID:}        # 미설정이면 네이버 소스 비활성
      client-secret: ${NAVER_CLIENT_SECRET:}
      display: 30
    digest:
      enabled: true
      cron: "0 0 18 * * *"                  # 매일 18:00 KST — 뉴스 워커 명세 §4.1
      zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
