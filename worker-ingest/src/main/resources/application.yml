spring:
  application:
    name: worker-ingest
  datasource:                                   # 스키마는 :db-migrations Liquibase master changelog가 기동 시 적용 (단일 소유)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphatalk}
    username: ${DB_USER:alphatalk}
    password: ${DB_PASSWORD:alphatalk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8084          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  ingest:
    poll-enabled: true
    poll-delay: 5m
    poll-initial-delay: 10s
    seen-ttl: 7d      # Redis 계약 v0.5 §3 seen:ingest TTL
    queue-max-len: 10000
    excerpt-max-length: 200
    fetch-concurrency: 4
    feeds:
      - id: yna-economy
        source: yna
        url: https://www.yna.co.kr/rss/economy.xml
      - id: yna-industry
        source: yna
        url: https://www.yna.co.kr/rss/industry.xml
      - id: hankyung-economy
        source: hankyung
        url: https://www.hankyung.com/feed/economy
      - id: hankyung-finance
        source: hankyung
        url: https://www.hankyung.com/feed/finance
      - id: mk-economy
        source: mk
        url: https://www.mk.co.kr/rss/30100041/
      - id: mk-stock
        source: mk
        url: https://www.mk.co.kr/rss/50200011/
      - id: donga-economy
        source: donga
        url: https://rss.donga.com/economy.xml
      - id: chosun-economy
        source: chosun
        url: https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml
      - id: newsis-economy
        source: newsis
        url: https://www.newsis.com/RSS/economy.xml
      - id: newsis-finance
        source: newsis
        url: https://www.newsis.com/RSS/bank.xml
      - id: newsis-industry
        source: newsis
        url: https://www.newsis.com/RSS/industry.xml
    digest:
      enabled: true
      cron: "0 0 18 * * *"                  # 매일 18:00 KST — 뉴스 워커 명세 §4.1. 대상 종목은 watchlist distinct 코드 (명세 §2.2)
      zone: Asia/Seoul
      enqueue-concurrency: ${DIGEST_ENQUEUE_CONCURRENCY:1}  # 적재 스레드풀 크기 — 종목 규모가 커지면 상향
      catch-up-on-startup: true             # 예정 시각에 워커가 죽어 있었으면 기동 직후 보충 — 명세 §4.1
      catch-up-reconcile-delay: 1m          # Redis 장애로 불완전한 보충을 다시 대조하는 주기
      market-enabled: true                  # 시장 다이제스트 잡 — 첫 배포는 llm-worker(N7)를 먼저 올린다(명세 §4.3)
      market-cron: "0 40 17 * * *"          # 17:40 KST — 종목 잡보다 20분 앞선 헤드룸

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  metrics:
    tags:
      application: ${spring.application.name}
