spring:
  config:
    import:                                     # 저장소 루트 secrets.yml — 로컬 시크릿(.gitignore 대상). 없으면 무시되고 환경변수 경로로 동작
      - optional:file:./secrets.yml             # 저장소 루트에서 실행할 때
      - optional:file:../secrets.yml            # bootRun(작업 디렉터리=모듈 디렉터리)으로 실행할 때

alphatalk:
  batch:
    stock-master:
      cron: "-"                                 # 로컬은 자동 실행하지 않는다 — 필요할 때 테스트·수동 호출로 적재
    dart:
      cron: "-"                                 # 로컬은 자동 실행하지 않는다 — 외부 API 호출·DB 변경은 수동 트리거로만
    # opinion 잡은 cron을 무효화하지 않는다 — 로컬에서도 운영과 같은 주기(영업일 07:00~17:50 · 10분)로
    # 자동 실행해야 수집→발행 흐름이 재현된다. 잡 빈은 opinion.enabled(secrets.yml) 없이는 등록되지 않으므로
    # 계정을 넣지 않은 로컬에서는 여전히 아무것도 돌지 않는다.
