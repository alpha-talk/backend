spring:
  config:
    import:                                     # 저장소 루트 secrets.yml — 로컬 시크릿(.gitignore 대상). 없으면 무시되고 환경변수 경로로 동작
      - optional:file:./secrets.yml             # 저장소 루트에서 실행할 때
      - optional:file:../secrets.yml            # bootRun(작업 디렉터리=모듈 디렉터리)으로 실행할 때

alphatalk:
  batch:
    stock-master:                               # 로컬은 자동 실행하지 않는다 — 필요할 때 테스트·수동 호출로 적재
      cron: "-"
      retry-cron: "-"                           # 재실행 크론도 함께 끈다 — 하나만 끄면 나머지가 KIS를 내려받고 DB를 바꾼다
    dart:
      cron: "-"                                 # 로컬은 자동 실행하지 않는다 — 외부 API 호출·DB 변경은 수동 트리거로만
    opinion:
      cron: "-"                                 # 로컬은 자동 실행하지 않는다 — 켜더라도(secrets.yml) 수동 트리거로만
    valuation:                                  # 켜더라도(secrets.yml) 수동 트리거로만
      cron: "-"
      retry-cron: "-"
    investor:
      cron: "-"
      retry-cron: "-"
    financials:
      cron: "-"
      retry-cron: "-"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus   # prometheus는 로컬 전용 노출 — 운영은 별도 보호 경계 뒤에서 opt-in
