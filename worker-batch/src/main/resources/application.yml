spring:
  application:
    name: worker-batch
  datasource:                                   # 스키마는 :db-migrations Liquibase master changelog가 기동 시 적용 (단일 소유)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphatalk}
    username: ${DB_USER:alphatalk}
    password: ${DB_PASSWORD:alphatalk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  data:
    redis:                                      # ShedLock 락 저장소 — 다중 기동 시 잡 중복 실행 방지 (KIS 워커 명세 §3.2)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8083          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  batch:
    enabled: true
    catch-up:
      enabled: true                           # 기동 시 오늘 크론 시각이 이미 지난 일 1회 잡을 순차 실행 (명세 §3.2) — 이미 성공했으면 잡이 스스로 스킵
      passes: 3                               # 재확인 횟수 — 앞 프로세스가 남긴 스테일 ShedLock이 첫 패스를 통째로 스킵시킬 수 있다
      pass-interval: 20m                      # 지평 40분 > valuation_daily의 lockAtMostFor 30분. 더 늘리면 부분 실패한 회차의 전 종목 재조회만 배가된다 (명세 §3.2)
      stop-timeout: 5s                        # 종료 시 따라잡기 스레드를 join하는 상한 — 남은 잡은 다음 기동/크론이 회수한다
    stock-master:
      enabled: true
      cron: "0 0 8 * * *"                       # 매일 08:00 KST — 원본이 07:40경 갱신된다 (명세 §3.1)
      retry-cron: "0 0 9,10,12 * * *"           # FAILED 회차 재실행 — 유니버스가 부분이면 valuation·investor가 그날 통째로 막힌다 (명세 §3.2). SUCCESS면 내려받지 않는다
      base-url: https://new.real.download.dws.co.kr/common/master
    dart:                                       # OpenDART 기업개황 → KSIC 업종축 (뉴스 명세 §3.6)
      enabled: true
      api-key: ${DART_API_KEY:}
      base-url: https://opendart.fss.or.kr/api
      cron: "0 30 6 * * SUN"                    # 주 1회 — 회사 정보는 변동이 드물다 (KIS 워커 명세 §3.1)
      request-interval: 50ms
      group-max-size: 100                       # 초과 그룹은 KSIC 한 단계 아래로 분할 — worker-llm fanout-cap과 맞춘다
      max-failure-ratio: 0.05                   # 조회 실패가 이 비율을 넘으면 부분 결과를 저장하지 않고 잡을 실패시킨다
      group-overrides:                          # DART 신고 업종이 뉴스 맥락과 어긋나는 종목의 수동 보정
        "[005930]": "261"                       # 삼성전자 — DART 신고는 264(통신·방송장비)지만 반도체 뉴스가 본류다
    holidays: []                                # KRX 휴장일(yyyy-MM-dd) — worker-price와 같은 목록을 각자 든다, 함께 갱신 (명세 §2.7)
    kis:
      accounts-json: ${KIS_ACCOUNTS:[]}         # [{"keyId":"...","appkey":"...","appsecret":"..."}] — price와 같은 계정, 토큰은 Redis로 공유 (Redis 계약 v0.16)
      rate-factor: ${KIS_RATE_FACTOR:0.75}      # 공용 gate 상한 = 15/s × factor — price와 같은 KIS_RATE_FACTOR를 읽어 합산 버킷 파라미터가 갈라지지 않게 한다
    opinion:                                    # 증권사 투자의견 수집·발행 (명세 §3.3)
      enabled: false                            # KIS 계정이 있는 환경에서만 켠다 — 켜면 계정 필수(fail-closed)
      cron: "0 0/10 7-17 * * MON-FRI"           # 영업일 07:00~17:50 10분 주기 — 휴장일은 잡 내부 캘린더가 스킵
      calls-per-second: 4.0                     # 잡 자체 상한 4콜/s (명세 §3.1)
      request-interval: 250ms
      scan-limit: 500                           # 회차당 미통보 스캔 상한
    valuation:                                  # PER·PBR·EPS·BPS + 시총 일일 적재 (명세 §3.1)
      enabled: false                            # KIS 계정이 있는 환경에서만 켠다 — 켜면 계정 필수(fail-closed)
      cron: "0 50 16 * * MON-FRI"               # 영업일 16:50 — 종가 확정 후, 휴장일은 잡 내부 캘린더가 스킵
      retry-cron: "0 20 17,18 * * MON-FRI"      # 부분 실패(FAILED) 회차 재실행 — 날짜 키 스냅샷이라 당일 안에만 채울 수 있다. SUCCESS면 no-op
      calls-per-second: 8.0                     # 전 종목 ~2,600콜 ≈ 5.5분 — 공용 gate가 계정 합산 상한을 지킨다
      chunk-size: 200                           # 트랜잭션당 upsert 행 수 — 중단 시 부분 진행 보존
    investor:                                   # 투자자별 순매수 확정치 일일 적재 (명세 §3.1)
      enabled: false                            # KIS 계정이 있는 환경에서만 켠다 — 켜면 계정 필수(fail-closed)
      cron: "0 10 17 * * MON-FRI"               # 영업일 17:10 — 장마감 후 확정치
      calls-per-second: 8.0
    financials:                                 # OpenDART 정기공시 → 재무 요약 (명세 §3.1)
      enabled: false                            # DART 키가 있는 환경에서만 켠다 — 켜면 키 필수(fail-closed)
      cron: "0 0 6 * * *"                       # 매일 06:00 — 공시 시즌 증분
      retry-cron: "0 0 9,13,17 * * *"           # FAILED 회차 재실행 — 창 끝에서 실패한 공시는 다음 날 감지 창을 벗어난다 (명세 §3.2). SUCCESS면 no-op
      lookback-days: 7                          # list.json 감지 창 — 잡이 며칠 실패해도 창 안에서 자가 회복
      backfill-years: 3                         # 초기 백필 조회 창 — core-api 재무 API의 기본 3년과 맞춘다 (명세 §3.2)
      backfill-per-run: 100                     # 회차당 백필 종목 상한 — 행이 없는 종목만 대상, 며칠에 걸쳐 수렴 (0=끔)
      failure-streak-limit: 5                   # 연속 실패가 이 수에 닿으면 회차를 FAILED로 중단 — DART 전면 장애 시 호출량 소진 방지

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
