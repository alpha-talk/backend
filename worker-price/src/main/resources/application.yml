spring:
  application:
    name: worker-price
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  datasource:                                   # 스키마는 :db-migrations Liquibase master changelog가 기동 시 적용 (단일 소유)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphatalk}
    username: ${DB_USER:alphatalk}
    password: ${DB_PASSWORD:alphatalk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  task:
    scheduling:
      pool:
        size: 4                                 # 200ms 틱 flush가 장시간 봉 잡(16:00·16:30·재시도)에 굶지 않도록 분리 — 기본값 1이면 같은 스레드를 공유한다

server:
  port: 8082          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  price:
    enabled: false                        # KIS 계정 설정 후 활성화 — 활성 시 accounts 필수 (fail-closed)
    accounts-json: ${KIS_ACCOUNTS:[]}     # [{"keyId":"...","appkey":"...","appsecret":"..."}] — 시크릿 매니저 주입 (§5)
    conflation-ms: 200                    # 틱 conflation 플러시 주기 100~250ms (§2.4)
    rate-factor: ${KIS_RATE_FACTOR:0.75}  # 공식 유량 대비 내부 한도 비율 (§1.3)
    maintain-interval-ms: 1000            # 오케스트레이터 리컨실 주기 — 리더 갱신·세션 유지보수
    removal-grace-ms: 30000               # 구독 해지 30초 유예, 재수요 시 취소 (§2.2)
    market-hours-enforced: true           # 07:50 세션 준비 → 08:00 구독(NXT 프리) → 20:00 해제(NXT 애프터 종료) (§2.7)
    holidays: []                          # KRX 휴장일(yyyy-MM-dd) — 공지 기준 수동 관리, 주말은 자동 제외 (§2.7)
    poll-interval-ms: 30000               # WS 용량 초과 강등 심볼 REST 폴링 주기 — 하위 60s 확장은 후속 (§2.5)
    poll-budget-factor: 0.5               # 계정 REST 유량 중 폴링에 배정하는 예산 비율 (§2.5)
    candle-enabled: false                 # 16:30 일봉 upsert — stock_master 전 종목, 비면 수요 종목 대체 (§2.6)
    candle-backfill-days: 90              # 최초 백필 조회 구간 — 1콜 100봉 한도 안쪽 (§2.6)
    candle-sync-on-startup: false         # 기동 직후 1회 수동 백필 — 16:30 크론을 기다리지 않는 로컬 검증용. 리더락을 거치지 않으므로 다중 인스턴스 운영에서 켜지 않는다
    tick-silence-ms: ${TICK_SILENCE_MS:20000}          # 통합 등록 후 침묵 임계 — 초과 시 KRX 전용 재등록 (§2.3)
    minute-candle-enabled: false          # 분봉 read-through 신선화 내부 API + 16:00 확정·04:30 퍼지 (§2.6)
    minute-candle-fresh-sec: ${MINUTE_CANDLE_FRESH_SEC:60}              # 신선 임계 — 이 안에서는 KIS 재조회 없이 no-op (§2.6)
    minute-candle-retention-days: ${MINUTE_CANDLE_RETENTION_DAYS:30}    # 보존 일수 — 초과분은 새벽 퍼지 (§2.6)

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
