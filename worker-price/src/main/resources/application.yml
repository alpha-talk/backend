spring:
  application:
    name: worker-price
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  datasource:                                   # 스키마는 :db-migrations Liquibase master changelog가 기동 시 적용 (단일 소유)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphatalk}
    username: ${DB_USER:alphatalk}
    password: ${DB_PASSWORD:alphatalk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 8082          # 모노레포 포트 배치 (기획안 §3.1)
  shutdown: graceful

alphatalk:
  price:
    enabled: false                        # KIS 계정·종목 설정 후 활성화 — 활성 시 accounts·symbols 필수 (fail-closed)
    env: ${KIS_ENV:vts}                   # vts=모의투자 | prod=실전 (KIS 워커 명세 §1.1)
    accounts-json: ${KIS_ACCOUNTS:[]}     # [{"keyId":"...","appkey":"...","appsecret":"..."}] — 시크릿 매니저 주입 (§5)
    symbols: []                           # M2 PoC 고정 종목 — demand 연동(§2.1)은 계약 합의 후 P6
    conflation-ms: 200                    # 틱 conflation 플러시 주기 100~250ms (§2.4)
    rate-factor: ${KIS_RATE_FACTOR:0.75}  # 공식 유량 대비 내부 한도 비율 (§1.3)
    maintain-interval-ms: 1000            # 오케스트레이터 리컨실 주기 — 리더 갱신·세션 유지보수
    removal-grace-ms: 30000               # 구독 해지 30초 유예, 재수요 시 취소 (§2.2)
    market-hours-enforced: true           # 07:50 세션 준비 → 08:00 구독(NXT 프리) → 20:00 해제(NXT 애프터 종료) (§2.7)
    holidays: []                          # KRX 휴장일(yyyy-MM-dd) — 공지 기준 수동 관리, 주말은 자동 제외 (§2.7)
    poll-interval-ms: 30000               # WS 용량 초과 강등 심볼 REST 폴링 주기 — 하위 60s 확장은 후속 (§2.5)
    poll-budget-factor: 0.5               # 계정 REST 유량 중 폴링에 배정하는 예산 비율 (§2.5)
    candle-enabled: false                 # 16:30 일봉 upsert — 관심 유니버스(symbols) 대상, 전 종목은 stock_master(worker-batch) 확보 후 (§2.6)
    candle-backfill-days: 90              # 최초 백필 조회 구간 — 1콜 100봉 한도 안쪽 (§2.6)

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
