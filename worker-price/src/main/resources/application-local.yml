spring:
  config:
    import:                                     # 저장소 루트 secrets.yml — 로컬 시크릿(.gitignore 대상). 없으면 무시되고 환경변수 경로로 동작
      - optional:file:./secrets.yml             # 저장소 루트에서 실행할 때
      - optional:file:../secrets.yml            # bootRun(작업 디렉터리=모듈 디렉터리)으로 실행할 때

alphatalk:
  price:
    market-hours-enforced: true    # 장 운영 창(07:50~20:00, §2.7) 준수 — 창 밖 심야 스모크만 false로 완화
    candle-sync-on-startup: true   # 로컬 기동 시 일봉 백필 1회 — stock_master 활성 종목 전체 대상, 종목당 1콜. 실시간·일봉·분봉 수집 자체는 secrets.yml의 KIS_ACCOUNTS 설정 여부가 스위치

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus   # prometheus는 로컬 전용 노출 — 운영은 별도 보호 경계 뒤에서 opt-in
