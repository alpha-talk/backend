# Alpha Talk 로컬 모니터링 — Spring Boot actuator /actuator/prometheus 스크레이프.
# 앱은 호스트(bootRun)에서 뜨므로 host.docker.internal로 접근한다 (기획안 §3.1 포트 배치).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: ws
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: worker-price
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: worker-batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
  - job_name: worker-ingest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
  - job_name: worker-llm
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
